name: FinSight AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality, security, and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral integration secrets
        run: |
          postgres_password="$(openssl rand -hex 24)"
          assignment_secret="$(openssl rand -hex 32)"
          api_auth_token="$(openssl rand -hex 32)"
          {
            echo "POSTGRES_PASSWORD=${postgres_password}"
            echo "FINSIGHT_DATABASE_URL=postgresql+psycopg://finsight:${postgres_password}@localhost:5432/finsight"
            echo "FINSIGHT_EXPERIMENT_ASSIGNMENT_SECRET=${assignment_secret}"
            echo "FINSIGHT_API_AUTH_TOKEN=${api_auth_token}"
          } >> "$GITHUB_ENV"

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src tests

      - name: Install analyst application
        run: npm ci --prefix apps/web

      - name: Validate analyst application
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build

      - name: Build hardened application images
        run: |
          docker build --tag finsight-api:local .
          docker build --tag finsight-web:local apps/web
          test "$(docker image inspect finsight-api:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect finsight-web:local --format '{{.Config.User}}')" = "10001:10001"

      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finsight-api:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Scan web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finsight-web:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          skip-setup-trivy: true

      - name: Validate offline evaluation contract
        run: |
          finsight evaluate \
            --dataset evals/fixtures/synthetic_dataset_v1.json \
            --control-run evals/fixtures/control_run_v1.json \
            --treatment-run evals/fixtures/treatment_run_v1.json \
            --output /tmp/finsight-evaluation-report.json \
            --top-k 3 \
            --bootstrap-iterations 200 \
            --seed 17 > /tmp/finsight-evaluation-stdout.json
          python -c "import json; report=json.load(open('/tmp/finsight-evaluation-report.json')); assert report['benchmark_claim_allowed'] is False"

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify database schema is current
        run: alembic check

      - name: Validate controlled experiment contract
        run: |
          finsight register-experiment \
            --spec experiments/fixtures/answer_workflow_v1.json \
            --start > /tmp/finsight-experiment-registration.json
          finsight analyze-experiment \
            --experiment-key answer-workflow-v1 \
            > /tmp/finsight-experiment-analysis.json
          python -c "import json; report=json.load(open('/tmp/finsight-experiment-analysis.json')); assert report['analysis_ready'] is False; assert report['decision'] == 'collecting'"

      - name: Run unit and integration tests
        run: pytest
        env:
          FINSIGHT_RUN_DATABASE_TESTS: "1"

      - name: Smoke test composed API and analyst application
        run: |
          docker compose --profile application up -d --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null

      - name: Audit Python dependencies
        run: pip-audit

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
