name: Deploy FinSight staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan, deploy, capture evidence, or destroy the reviewed staging stack"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
          - capture
          - destroy
      profile:
        description: "Use standard custom-domain staging or the temporary portfolio-recording profile"
        required: true
        default: recording
        type: choice
        options:
          - recording
          - standard
      confirmation:
        description: "Enter DEPLOY STAGING for deploy or DESTROY STAGING for destroy"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  terraform:
    name: FinSight staging ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_certificate_arn: ${{ vars.FINSIGHT_CERTIFICATE_ARN }}
      TF_VAR_public_hostname: ${{ vars.FINSIGHT_PUBLIC_HOSTNAME }}
      TF_VAR_alarm_email: ${{ vars.FINSIGHT_ALARM_EMAIL }}
      TF_VAR_enable_openai_secret: ${{ vars.FINSIGHT_ENABLE_OPENAI_SECRET || 'false' }}
      TF_VAR_enable_otel_headers_secret: ${{ vars.FINSIGHT_ENABLE_OTEL_HEADERS_SECRET || 'false' }}
      TF_VAR_otel_traces_endpoint: ${{ vars.FINSIGHT_OTEL_TRACES_ENDPOINT }}
      TF_VAR_otel_metrics_endpoint: ${{ vars.FINSIGHT_OTEL_METRICS_ENDPOINT }}
      TF_VAR_sec_user_agent: ${{ vars.FINSIGHT_SEC_USER_AGENT }}
      TF_VAR_api_image_tag: ${{ github.sha }}
      TF_VAR_web_image_tag: ${{ github.sha }}
      TF_VAR_enable_recording_profile: ${{ inputs.profile == 'recording' && 'true' || 'false' }}
      TF_VAR_ecr_force_delete: ${{ (inputs.profile == 'recording' || inputs.mode == 'destroy') && 'true' || 'false' }}
      EVIDENCE_DIR: ${{ runner.temp }}/finsight-staging-evidence
      DESTROY_EVIDENCE_DIR: ${{ runner.temp }}/finsight-destroy-evidence

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/terraform/environments/staging

    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@v7

      - name: Require an explicit change confirmation
        if: inputs.mode == 'deploy' || inputs.mode == 'destroy'
        env:
          CHANGE_CONFIRMATION: ${{ inputs.confirmation }}
          CHANGE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$CHANGE_MODE" == "deploy" ]]; then
            test "$CHANGE_CONFIRMATION" = "DEPLOY STAGING"
          else
            test "$CHANGE_CONFIRMATION" = "DESTROY STAGING"
          fi

      - name: Validate required GitHub Environment variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "${{ vars.AWS_ACCOUNT_ID }}"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_sec_user_agent"
          if [[ "${{ inputs.profile }}" == "standard" && "${{ inputs.mode }}" != "destroy" ]]; then
            test -n "$TF_VAR_certificate_arn"
            test -n "$TF_VAR_public_hostname"
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: finsight-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Initialize remote state with S3 lockfiles
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate reviewed configuration
        run: |
          terraform fmt -check -recursive ../..
          terraform validate

      - name: Create read-only infrastructure plan
        if: inputs.mode == 'plan'
        run: terraform plan -input=false -lock-timeout=5m -var="deploy_services=true"

      - name: Bootstrap infrastructure without application services
        if: inputs.mode == 'deploy'
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -var="deploy_services=false"

      - name: Log in to Amazon ECR
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push immutable application images
        if: inputs.mode == 'deploy'
        working-directory: .
        run: |
          api_repository="$(terraform -chdir=infrastructure/terraform/environments/staging output -raw api_repository_url)"
          web_repository="$(terraform -chdir=infrastructure/terraform/environments/staging output -raw web_repository_url)"

          docker build --pull --tag "${api_repository}:${GITHUB_SHA}" .
          docker build --pull --tag "${web_repository}:${GITHUB_SHA}" apps/web
          docker push "${api_repository}:${GITHUB_SHA}"
          docker push "${web_repository}:${GITHUB_SHA}"

      - name: Hydrate mandatory AWS Secrets Manager values
        if: inputs.mode == 'deploy'
        run: |
          set +x

          ensure_generated_secret() {
            local secret_arn="$1"
            local bytes="$2"
            if aws secretsmanager get-secret-value --secret-id "$secret_arn" >/dev/null 2>&1; then
              return
            fi
            local value
            value="$(openssl rand -hex "$bytes")"
            echo "::add-mask::${value}"
            aws secretsmanager put-secret-value \
              --secret-id "$secret_arn" \
              --secret-string "$value" >/dev/null
          }

          api_token_secret="$(terraform output -raw api_auth_token_secret_arn)"
          assignment_secret="$(terraform output -raw experiment_assignment_secret_arn)"
          ensure_generated_secret "$api_token_secret" 32
          ensure_generated_secret "$assignment_secret" 32

          master_secret="$(terraform output -raw database_master_secret_arn)"
          database_secret="$(terraform output -raw database_url_secret_arn)"
          database_host="$(terraform output -raw database_address)"
          database_name="$(terraform output -raw database_name)"
          master_json="$(aws secretsmanager get-secret-value \
            --secret-id "$master_secret" \
            --query SecretString \
            --output text)"

          export DATABASE_HOST="$database_host"
          export DATABASE_NAME="$database_name"
          export MASTER_JSON="$master_json"
          database_url="$(python - <<'PY'
          import json
          import os
          from urllib.parse import quote

          credentials = json.loads(os.environ["MASTER_JSON"])
          username = quote(credentials["username"], safe="")
          password = quote(credentials["password"], safe="")
          host = os.environ["DATABASE_HOST"]
          database = os.environ["DATABASE_NAME"]
          print(f"postgresql+psycopg://{username}:{password}@{host}:5432/{database}")
          PY
          )"
          echo "::add-mask::${database_url}"
          aws secretsmanager put-secret-value \
            --secret-id "$database_secret" \
            --secret-string "$database_url" >/dev/null

      - name: Verify optional secret values
        if: inputs.mode == 'deploy'
        run: |
          if [[ "$TF_VAR_enable_openai_secret" == "true" ]]; then
            aws secretsmanager get-secret-value \
              --secret-id "$(terraform output -raw openai_api_key_secret_arn)" >/dev/null
          fi
          if [[ "$TF_VAR_enable_otel_headers_secret" == "true" ]]; then
            aws secretsmanager get-secret-value \
              --secret-id "$(terraform output -raw otel_export_headers_secret_arn)" >/dev/null
          fi

      - name: Run one-shot database migration
        if: inputs.mode == 'deploy'
        run: |
          cluster="$(terraform output -raw ecs_cluster_name)"
          task_definition="$(terraform output -raw api_task_definition_arn)"
          subnets="$(terraform output -json application_subnet_ids)"
          security_group="$(terraform output -raw api_security_group_id)"
          network_configuration="$(jq -cn \
            --argjson subnets "$subnets" \
            --arg security_group "$security_group" \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$security_group],assignPublicIp:"DISABLED"}}')"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network_configuration" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"

          test -n "$task_arn"
          test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"

          exit_code="$(aws ecs describe-tasks \
            --cluster "$cluster" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)"
          test "$exit_code" = "0"

      - name: Deploy private services behind TLS
        if: inputs.mode == 'deploy'
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -var="deploy_services=true"

          cluster="$(terraform output -raw ecs_cluster_name)"
          aws ecs wait services-stable --cluster "$cluster" --services api web

      - name: Capture sanitized deployment evidence
        if: inputs.mode == 'deploy' || inputs.mode == 'capture'
        run: ../../../../scripts/aws/capture_staging_evidence.sh "$EVIDENCE_DIR"

      - name: Upload deployment evidence
        if: inputs.mode == 'deploy' || inputs.mode == 'capture'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: finsight-staging-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish deployment summary
        if: inputs.mode == 'deploy'
        run: |
          {
            echo "## FinSight staging deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Application: $(terraform output -raw application_url)"
            echo "- Database migrations: completed before service rollout"
            echo "- Credentials: short-lived GitHub OIDC session"
            echo "- Evidence: uploaded as \`finsight-staging-evidence-${{ github.run_id }}\`"
            echo "- Required next action: capture the portfolio screenshots, then run \`destroy\` with \`DESTROY STAGING\` the same day"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the pre-destroy inventory
        if: inputs.mode == 'destroy'
        env:
          DESTROY_ACTOR: ${{ github.actor }}
          DESTROY_PROFILE: ${{ inputs.profile }}
          DESTROY_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$DESTROY_EVIDENCE_DIR"
          terraform state list > "$DESTROY_EVIDENCE_DIR/resources-before.txt"
          jq -n \
            --arg started_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg actor "$DESTROY_ACTOR" \
            --arg profile "$DESTROY_PROFILE" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg run_id "$DESTROY_RUN_ID" \
            '{
              started_at_utc: $started_at_utc,
              actor: $actor,
              profile: $profile,
              commit_sha: $commit_sha,
              workflow_run_id: $run_id,
              confirmation: "DESTROY STAGING"
            }' > "$DESTROY_EVIDENCE_DIR/manifest.json"

      - name: Destroy the staging runtime
        if: inputs.mode == 'destroy'
        run: |
          terraform destroy \
            -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -var="deploy_services=false"

      - name: Verify the Terraform state is empty
        if: inputs.mode == 'destroy'
        run: |
          terraform state list > "$DESTROY_EVIDENCE_DIR/resources-after.txt"
          test ! -s "$DESTROY_EVIDENCE_DIR/resources-after.txt"
          jq \
            --arg completed_at_utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '. + {completed_at_utc: $completed_at_utc, terraform_state_empty: true}' \
            "$DESTROY_EVIDENCE_DIR/manifest.json" \
            > "$DESTROY_EVIDENCE_DIR/manifest.completed.json"
          mv \
            "$DESTROY_EVIDENCE_DIR/manifest.completed.json" \
            "$DESTROY_EVIDENCE_DIR/manifest.json"

      - name: Upload destroy audit evidence
        if: always() && inputs.mode == 'destroy'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: finsight-destroy-evidence-${{ github.run_id }}
          path: ${{ env.DESTROY_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish destroy summary
        if: inputs.mode == 'destroy'
        run: |
          {
            echo "## FinSight staging destroy"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo "- Terraform state: empty"
            echo "- Runtime resources: destroyed"
            echo "- Audit evidence: uploaded as \`finsight-destroy-evidence-${{ github.run_id }}\`"
            echo "- Bootstrap S3 state bucket and GitHub OIDC role: intentionally retained"
          } >> "$GITHUB_STEP_SUMMARY"
